[project]
name = "options-bt"
version = "0.1.0"
description = "Options strategy backtesting engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "scipy",
    "matplotlib",
]

[project.scripts]
options-bt = "options_bt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_bt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
