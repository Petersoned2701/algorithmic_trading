format: parquet
layout: long
date_column: date
date_format: null
columns:
  underlying: symbol
  underlying_price: underlying_price
  expiration: expiration
  strike: strike
  right: type
  bid: bid
  ask: ask
  delta: delta
  iv: implied_volatility
right_values:
  C: call
  P: put
defaults:
  style: american
  settlement: PM
  multiplier: 100
verified: false
